# ============================================================================
# KORTIX DOCKER COMPOSE - PRODUCTION & DEVELOPMENT
# ============================================================================
# This Docker Compose file runs all Kortix services:
#   - Backend API (FastAPI)
#   - Background Workers (Dramatiq)
#   - Frontend (Next.js)
#   - Redis (Message broker & cache)
#
# 📋 Prerequisites:
#   1. Configure backend/.env with your settings (copy from .env.example)
#   2. Configure frontend/.env with your settings (copy from .env.example)
#   3. Have a Supabase instance (cloud or self-hosted)
#   4. Required API keys: LLM provider, Tavily, Firecrawl
#
# 🚀 Quick Start:
#   docker compose up -d          # Start all services
#   docker compose down           # Stop all services
#   docker compose logs -f        # View all logs
#   docker compose ps             # Check status
#   docker compose restart        # Restart services
#
# 📊 Scaling Workers:
#   docker compose up -d --scale worker=3
#
# 🔗 Access:
#   - Frontend:     http://localhost:3000
#   - Backend API:  http://localhost:8000
#   - API Docs:     http://localhost:8000/docs
#
# 📖 Documentation:
#   - Full deployment guide: See DEPLOYMENT.md
#   - Quick deploy guide: See QUICK_DEPLOY.md
# ============================================================================

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./backend/services/docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    image: ghcr.io/suna-ai/suna-backend:latest
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/.env:/app/.env:ro
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_SSL=False
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started

  worker:
    image: ghcr.io/suna-ai/suna-backend:latest
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uv run dramatiq --skip-logging --processes 4 --threads 4 run_agent_background
    volumes:
      - ./backend/.env:/app/.env:ro
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_SSL=False
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    init: true
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  redis_data:
